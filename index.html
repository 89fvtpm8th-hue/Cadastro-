<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/Login.css">
</head>
<body>
    <main>
        <section class="conteiner">
            <div class="logo">
                <img src="img/logo.png" alt="Logo do Sicoob">
            </div>
            <div class="form">
                <input type="text" placeholder="Usuário"><br>
                <input class="senha" type="password" placeholder="Senha">
                <button>Entrar</button>
                <a href="">Cadastrar</a>
                <img class="logo-cartao" src="img/Logo2.png" alt="Logo">
                <img class="nome-cartao" src="img/Sicoob.png" alt="Logo">
                <img class="chip" src="img/chip.png" alt="Logo">
                <img class="rede" src="img/rede.png" alt="Logo">
            </div>
            <div class="mascote">
                <img src="img/mascote.png" alt="mascote">
            </div>
            <div class="verde"></div>
            <div class="verdeEscuro"></div>
        </section>
    </main>
</body>
</html>
